{{- /* Brand fonts (ported from the Kit landing page): Montserrat for UI/body,
       Domine available for optional serif accents. Weights trimmed to those actually used. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Domine:wght@400;500;600;700&display=swap">

{{- /* Reading progress indicator - optimized with RAF */ -}}
{{- if .IsPage }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const progressBar = document.querySelector('.reading-progress-bar');
    if (!progressBar) return;
    
    let ticking = false;
    
    function updateProgressBar() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = scrollPercent + '%';
        ticking = false;
    }
    
    window.addEventListener('scroll', function() {
        if (!ticking) {
            window.requestAnimationFrame(updateProgressBar);
            ticking = true;
        }
    }, { passive: true });
    
    // Initialize on load
    updateProgressBar();
});
</script>
{{- end }}
